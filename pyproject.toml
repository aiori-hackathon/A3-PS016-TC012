[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiori-pipeline"
version = "0.1.0"
description = "Offline LTE handover data validation, causal features and evaluation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.6,<2"]

[tool.setuptools.packages.find]
include = ["aiori_pipeline*"]
